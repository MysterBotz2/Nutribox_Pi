[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutribox-pi"
version = "0.1.0"
description = "PI-0 foundation for the Nutri-Box Raspberry Pi client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
nutribox-pi = "nutribox_pi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nutribox_pi"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
